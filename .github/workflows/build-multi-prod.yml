name: Prepare Yakit Release

on:
  workflow_dispatch:
    inputs:
      editions:
        description: Editions to preassemble
        type: choice
        default: yakit,yakitEE
        options: [yakit, yakitEE, 'yakit,yakitEE']
      release_version:
        description: Optional software version for a branch rehearsal
        type: string
  push:
    tags:
      - 'v*'
      - '!v*-render'
      - '!v*-irify'
      - '!v*-link-render'
      - '!v*-memfit'

permissions:
  contents: write

jobs:
  prepare:
    uses: ./.github/workflows/release-prepare.yml
    with:
      editions: ${{ inputs.editions || 'yakit,yakitEE' }}
      release_version: ${{ inputs.release_version || '' }}
