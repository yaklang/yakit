name: 启动测试
run-name: "${{ github.event.pull_request.draft && '[WIP] ' || '' }}启动测试 · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    # Intentionally do not run for renderer-only (or test/docs-only) changes.
    # Manual dispatch is available when updating the smoke suite or pinned artifacts.
    paths:
      - 'app/main/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-startup-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  startup:
    name: "${{ github.event.pull_request.draft && '[WIP] ' || '' }}启动测试 (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: yarn
      - name: Cache pinned engines and Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/startup-engines
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: startup-artifacts-${{ runner.os }}-${{ runner.arch }}-27-${{ hashFiles('scripts/engine-startup/engines.json') }}
      - name: Install locked client/test dependencies
        timeout-minutes: 5
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive --network-timeout 60000
      - name: Prepare locked Electron 27 runtime
        timeout-minutes: 2
        run: node node_modules/electron/install.js
      - name: Verify lifecycle, authentication, cancellation and fallback regressions
        timeout-minutes: 2
        run: yarn test:engine-startup --reporter=default --reporter=junit --outputFile.junit=engine-startup-junit.xml
      - name: Download pinned IPC engine from CDN (never compile)
        timeout-minutes: 3
        shell: bash
        run: node scripts/engine-startup/download-engine.cjs ipc "$RUNNER_TEMP/startup-engines"
      - name: Electron main auto / IPC-only / TCP startup smoke
        timeout-minutes: 2
        shell: bash
        run: |
          binary="$(node scripts/engine-startup/download-engine.cjs ipc "$RUNNER_TEMP/startup-engines")"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/engine-startup/verify-electron-ipc.cjs "$binary" 1 matrix > ipc-electron.json
          else
            node scripts/engine-startup/verify-electron-ipc.cjs "$binary" 1 matrix > ipc-electron.json
          fi
          cat ipc-electron.json
      - name: Windows released legacy engine / secure TCP compatibility
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          binary="$(node scripts/engine-startup/download-engine.cjs legacy "$RUNNER_TEMP/startup-engines")"
          node scripts/engine-startup/verify-real-engine.cjs "$binary" > legacy-engine.json
          node scripts/engine-startup/verify-electron-ipc.cjs "$binary" 1 auto manual-tcp > legacy-recovery.json
          cat legacy-engine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            engine-startup-junit.xml
            ipc-electron.json
            legacy-engine.json
            legacy-recovery.json
          if-no-files-found: warn
          retention-days: 14
