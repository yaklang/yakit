name: Publish OSS Version Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Select version type
        required: true
        type: choice
        default: ce
        options: [ce, ee, irify, irifyee, memfit]

permissions:
  contents: read

jobs:
  build_yakit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Shared with Finalize, including the read/check/write of channel pointers.
      group: release-channel-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Validate the release identity and reject channel downgrades
        env:
          RELEASE_EDITION: ${{ inputs.version }}
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
        run: node scripts/release/channels.mjs
