name: Build Memfit Prod

on:
  push:
    tags: ['v*-memfit']

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-desktop-packages.yml
    with:
      platform: mwl
      edition: memfit
      include_legacy: true
      engine: true
      sign: true
    secrets: inherit

  publish_memfit_to_oss:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.packages.outputs.artifact }}
          path: packages
      - name: Publish verified installers using the actual embedded build version
        uses: tvrcgo/upload-to-oss@master
        with:
          key-id: ${{ secrets.OSS_KEY_ID }}
          key-secret: ${{ secrets.OSS_KEY_SECRET }}
          region: oss-accelerate
          bucket: yaklang
          assets: |
            packages/*:/memfit/${{ needs.packages.outputs.version }}/
      - name: Save tag to build-version mapping for manual latest-version publication
        uses: tvrcgo/upload-to-oss@master
        with:
          key-id: ${{ secrets.OSS_KEY_ID }}
          key-secret: ${{ secrets.OSS_KEY_SECRET }}
          region: oss-accelerate
          bucket: yaklang
          assets: |
            packages/build-version.txt:/memfit/build-tags/${{ github.ref_name }}/build-version.txt
