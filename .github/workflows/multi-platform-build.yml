name: Multi-Platform Build Develop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platforms (mwl = Windows + Linux + macOS)'
        type: choice
        default: mwl
        options: [mwl, windows, darwin, linux, uos]
      version:
        description: 'Application edition (memfit = AI Senso)'
        type: choice
        default: memfit
        options: [memfit, ce, ee, se, irify, irifyee]
      engine:
        description: 'Include Yak engine'
        type: boolean
        default: true
      engineVersion:
        description: 'Engine version (empty = latest at workflow start)'
        type: string
        default: ''
      legacy:
        description: 'Build legacy packages using Electron 22.3.27'
        type: boolean
        default: false
      noBuiltInYakVersion:
        description: 'Omit built-in engine version file'
        type: boolean
        default: false
      devTool:
        description: 'Display developer tools'
        type: boolean
        default: false
      skipEnterpriseLicense:
        description: 'EE only: skip enterprise license verification'
        type: boolean
        default: false
      sign:
        description: 'Sign packages (requires Apple/Azure secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-desktop-packages.yml
    with:
      platform: ${{ inputs.platform }}
      edition: ${{ inputs.version }}
      legacy: ${{ inputs.legacy }}
      engine: ${{ inputs.engine }}
      engine_version: ${{ inputs.engineVersion }}
      hide_engine_version: ${{ inputs.noBuiltInYakVersion }}
      dev_tool: ${{ inputs.devTool }}
      skip_enterprise_license: ${{ inputs.skipEnterpriseLicense }}
      sign: ${{ inputs.sign }}
    secrets: inherit
