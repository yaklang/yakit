name: Sync Upstream, Auto-Translate & Auto-Release (English Edition)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release အသစ် အတင်းထုတ်မည်လား? (true ရွေးပါ)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "https://github.com/yaklang/yakit.git"
  UPSTREAM_BRANCH: "master"
  TARGET_BRANCH: "english-edition"

jobs:
  sync-and-translate:
    name: Sync Upstream & Translate to English
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_release.outputs.should_release }}
      release_tag: ${{ steps.check_release.outputs.release_tag }}
    steps:
      - name: 1. Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configure Git & Cleanly Sync Upstream Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # လက်ရှိ Repo ထဲရှိ မိမိ၏ Custom ဖိုင်များကို အရင်ဆုံး သိမ်းဆည်းထားခြင်း
          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          if [ -f ".github/security_glossary.json" ]; then
            cp .github/security_glossary.json /tmp/backup/security_glossary.json
          fi
          if [ -f ".i18n_cache.json" ]; then
            cp .i18n_cache.json /tmp/backup/.i18n_cache.json
          fi
          if [ -f "README_EN.md" ]; then
            cp README_EN.md /tmp/backup/README_EN.md
          fi
          if [ -f "README_LEGACY.md" ]; then
            cp README_LEGACY.md /tmp/backup/README_LEGACY.md
          fi

          # Tag conflict (exit code 1) လုံးဝမဖြစ်စေရန် --no-tags ဖြင့် ဆွဲယူခြင်း
          git remote add upstream "${{ env.UPSTREAM_REPO }}" 2>/dev/null || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch --no-tags --depth=1 upstream "${{ env.UPSTREAM_BRANCH }}:refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          git fetch --no-tags --depth=1 origin "${{ env.TARGET_BRANCH }}:refs/remotes/origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || true

          # english-edition ရှိပြီးသားဆိုလျှင် ဘာသာပြန် Cache ကို ယူပြီး upstream/master ကုဒ်အသန့်ဖြင့် ပြန်တည်ဆောက်ခြင်း
          if git show-ref --verify --quiet "refs/remotes/origin/${{ env.TARGET_BRANCH }}"; then
            git show "origin/${{ env.TARGET_BRANCH }}:.i18n_cache.json" > /tmp/backup/.i18n_cache_json_prev 2>/dev/null || true
            if [ -s "/tmp/backup/.i18n_cache_json_prev" ]; then
              cp /tmp/backup/.i18n_cache_json_prev /tmp/backup/.i18n_cache.json
            fi
            git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}"
            git rm -rf --quiet . || true
            git checkout "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}" -- .
          else
            git checkout -B "${{ env.TARGET_BRANCH }}" "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          fi

          # မူရင်း Repo မှ Workflow အဟောင်းများကို ဖယ်ရှားပြီး မိမိ၏ Custom ဖိုင်များ ပြန်ထည့်ခြင်း
          rm -rf .github/workflows/*
          mkdir -p .github/workflows
          cp -r /tmp/backup/workflows/* .github/workflows/ 2>/dev/null || true
          if [ -f "/tmp/backup/security_glossary.json" ]; then
            cp /tmp/backup/security_glossary.json .github/security_glossary.json
          fi
          if [ -f "/tmp/backup/.i18n_cache.json" ] && [ -s "/tmp/backup/.i18n_cache.json" ]; then
            cp /tmp/backup/.i18n_cache.json .i18n_cache.json
          fi
          if [ -f "/tmp/backup/README_EN.md" ]; then
            cp /tmp/backup/README_EN.md README_EN.md
            cp /tmp/backup/README_EN.md README.md
            cp /tmp/backup/README_EN.md README-EN.md
          fi
          if [ -f "/tmp/backup/README_LEGACY.md" ]; then
            cp /tmp/backup/README_LEGACY.md README_LEGACY.md
          fi

      - name: 3. Setup Python for Safe i18n Localization
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Translation Dependencies
        run: |
          python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: 5. Enforce English Default UI & Safely Translate JSON Locales
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import time
          from deep_translator import GoogleTranslator

          # ၁။ Main UI နှင့် Startup ဝင်းဒိုးရှိ i18n.ts များကို English (en) သို့ ပြောင်းခြင်း
          for root, _, files in os.walk("app/renderer"):
              if "node_modules" in root:
                  continue
              for f in files:
                  full = os.path.join(root, f)
                  if f in ("i18n.ts", "i18n.js") or (root.endswith("i18n") and f.endswith((".ts", ".js"))):
                      with open(full, "r", encoding="utf-8") as fp:
                          txt = fp.read()
                      new_txt = re.sub(r"(lng\s*:\s*)([^,\n]*?)'zh(-CN)?'", r"\1localStorage.getItem('i18nextLng') || 'en'", txt)
                      new_txt = re.sub(r"(fallbackLng\s*:\s*)'zh(-CN)?'", r"\1'en'", new_txt)
                      if new_txt != txt:
                          with open(full, "w", encoding="utf-8") as fp:
                              fp.write(new_txt)
                          print(f"Patched default language in: {full}")
                  elif f == "index.html":
                      with open(full, "r", encoding="utf-8") as fp:
                          html = fp.read()
                      new_html = html.replace("正在加载中", "Loading...")
                      if new_html != html:
                          with open(full, "w", encoding="utf-8") as fp:
                              fp.write(new_html)
                          print(f"Patched startup loading text in: {full}")

          # ၂။ Locale JSON ဖိုင်များကိုသာ ဘေးကင်းစွာ ဘာသာပြန်ခြင်း (.ts/.tsx ကုဒ်များကို လုံးဝမထိပါ)
          CACHE_FILE = ".i18n_cache.json"
          GLOSSARY_FILE = ".github/security_glossary.json"
          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          placeholder_re = re.compile(r'(\{\{.*?\}\}|\{[0-9a-zA-Z_]+\})')

          def has_zh(text):
              return bool(zh_char_re.search(str(text)))

          exact_glossary = {}
          inline_glossary = {}
          if os.path.exists(GLOSSARY_FILE):
              with open(GLOSSARY_FILE, 'r', encoding='utf-8') as f:
                  g_data = json.load(f)
              for _, mapping in g_data.get("terms", {}).items():
                  if isinstance(mapping, dict):
                      exact_glossary.update(mapping)
                      inline_glossary.update(mapping)
              exact_glossary.update(g_data.get("exact_only", {}))

          sorted_inline = sorted(inline_glossary.keys(), key=len, reverse=True)

          cache = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, 'r', encoding='utf-8') as f:
                      cache = json.load(f)
              except Exception:
                  cache = {}

          def safe_translate_one(orig):
              stripped = orig.strip()
              if stripped in exact_glossary:
                  return exact_glossary[stripped]

              tokens = []
              def mask_fn(m):
                  tokens.append(m.group(0))
                  return f"__PH{len(tokens)-1}__"

              masked = placeholder_re.sub(mask_fn, orig)
              for zh_k in sorted_inline:
                  if zh_k in masked:
                      masked = masked.replace(zh_k, f" {inline_glossary[zh_k]} ")

              if has_zh(masked):
                  for _ in range(3):
                      try:
                          masked = translator.translate(masked) or masked
                          break
                      except Exception:
                          time.sleep(1.2)

              for idx, tok in enumerate(tokens):
                  masked = re.sub(rf'__PH{idx}__', tok, masked, flags=re.IGNORECASE)
              return re.sub(r' {2,}', ' ', masked).strip()

          def batch_translate(texts):
              new_items = [t for t in texts if t not in cache and has_zh(t)]
              print(f"New Chinese strings to translate: {len(new_items)}")
              for idx, item in enumerate(new_items):
                  cache[item] = safe_translate_one(item)
                  if idx % 30 == 0 and idx > 0:
                      time.sleep(0.4)

          def collect_json(zh_obj, en_obj, bucket):
              for k, v in zh_obj.items():
                  if isinstance(v, dict):
                      collect_json(v, en_obj.get(k, {}) if isinstance(en_obj.get(k), dict) else {}, bucket)
                  elif isinstance(v, str) and has_zh(v):
                      if k not in en_obj or has_zh(en_obj.get(k, "")):
                          bucket.add(v)

          def apply_json(zh_obj, en_obj):
              changed = False
              for k, v in zh_obj.items():
                  if isinstance(v, dict):
                      if k not in en_obj or not isinstance(en_obj[k], dict):
                          en_obj[k] = {}
                          changed = True
                      if apply_json(v, en_obj[k]):
                          changed = True
                  elif isinstance(v, str) and has_zh(v):
                      if k not in en_obj or has_zh(en_obj.get(k, "")):
                          en_obj[k] = cache.get(v, v)
                          changed = True
              return changed

          locale_pairs = []
          for root, dirs, _ in os.walk("app/renderer"):
              if "node_modules" in root:
                  continue
              if os.path.basename(root) == "zh" and os.path.basename(os.path.dirname(root)) == "locales":
                  en_dir = os.path.join(os.path.dirname(root), "en")
                  locale_pairs.append((root, en_dir))

          for zh_dir, en_dir in locale_pairs:
              os.makedirs(en_dir, exist_ok=True)
              bucket = set()
              pairs = []
              for fname in sorted(os.listdir(zh_dir)):
                  if not fname.endswith(".json"):
                      continue
                  zh_p = os.path.join(zh_dir, fname)
                  en_p = os.path.join(en_dir, fname)
                  with open(zh_p, 'r', encoding='utf-8') as f:
                      zh_d = json.load(f)
                  en_d = {}
                  if os.path.exists(en_p):
                      try:
                          with open(en_p, 'r', encoding='utf-8') as f:
                              en_d = json.load(f)
                      except Exception:
                          en_d = {}
                  collect_json(zh_d, en_d, bucket)
                  pairs.append((en_p, zh_d, en_d))

              batch_translate(list(bucket))
              for en_p, zh_d, en_d in pairs:
                  if apply_json(zh_d, en_d):
                      out_str = json.dumps(en_d, ensure_ascii=False, indent=2)
                      json.loads(out_str)  # JSON မှန်ကန်ကြောင်း တစ်ခါတည်း စစ်ဆေးခြင်း
                      with open(en_p, 'w', encoding='utf-8') as f:
                          f.write(out_str)

          with open(CACHE_FILE, 'w', encoding='utf-8') as f:
              json.dump(cache, f, ensure_ascii=False, indent=2)
          EOF

      - name: 6. Commit and Push Verified English Edition
        run: |
          git add -f .i18n_cache.json .github/ 2>/dev/null || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): sync upstream master and update English locales safely"
          fi
          git push -u origin "${{ env.TARGET_BRANCH }}" --force

      - name: 7. Detect New Upstream Release & Prepare Tag
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_LATEST=$(gh api repos/yaklang/yakit/releases/latest --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$UPSTREAM_LATEST" ] || [ "$UPSTREAM_LATEST" == "null" ]; then
            UPSTREAM_LATEST=$(gh api 'repos/yaklang/yakit/releases?per_page=1' --jq '.[0].tag_name' 2>/dev/null || true)
          fi
          if [ -z "$UPSTREAM_LATEST" ] || [ "$UPSTREAM_LATEST" == "null" ]; then
            UPSTREAM_LATEST="v$(date +'%Y.%m.%d')"
          fi

          EN_TAG="${UPSTREAM_LATEST}-en"
          echo "Upstream Release: ${UPSTREAM_LATEST} -> Target Tag: ${EN_TAG}"

          RELEASE_EXISTS="false"
          if gh release view "${EN_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi

          if [ "${RELEASE_EXISTS}" == "false" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            git tag -f "${EN_TAG}" HEAD
            git push origin "refs/tags/${EN_TAG}" --force
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${EN_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=${EN_TAG}" >> "$GITHUB_OUTPUT"
          fi

  trigger-english-build:
    name: Auto-Trigger Multi-OS English Release
    needs: sync-and-translate
    if: needs.sync-and-translate.outputs.should_release == 'true'
    uses: ./.github/workflows/release-en.yml
    with:
      tag_name: ${{ needs.sync-and-translate.outputs.release_tag }}
      target_ref: ${{ needs.sync-and-translate.outputs.release_tag }}
    secrets: inherit
