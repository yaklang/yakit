name: Sync Upstream, Auto-Translate & Auto-Release (English Edition)

on:
  # Check for new upstream releases and sync automatically every six hours.
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual runs at any time.
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force an English release from the current code even if there is no new upstream release?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "https://github.com/yaklang/yakit.git"
  UPSTREAM_BRANCH: "master"
  TARGET_BRANCH: "english-edition"

jobs:
  sync-and-translate:
    name: Sync Upstream & Translate to English
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_release.outputs.should_release }}
      release_tag: ${{ steps.check_release.outputs.release_tag }}
    steps:
      - name: 1. Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configure Git, Fetch Upstream & Prepare Target Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${{ env.UPSTREAM_REPO }}" || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --tags
          git fetch origin --prune --tags
          
          # Use the existing english-edition branch, or create it if it does not exist.
          if git show-ref --verify --quiet "refs/remotes/origin/${{ env.TARGET_BRANCH }}"; then
            git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}"
          else
            git checkout -B "${{ env.TARGET_BRANCH }}" "upstream/${{ env.UPSTREAM_BRANCH }}"
          fi

      - name: 3. Merge Upstream Changes Cleanly
        run: |
          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          cp README_EN.md /tmp/backup/README_EN.md 2>/dev/null || true
          cp README_LEGACY.md /tmp/backup/README_LEGACY.md 2>/dev/null || true
          if [ -f ".github/security_glossary.json" ]; then
            cp .github/security_glossary.json /tmp/backup/security_glossary.json
          fi
          if [ -f ".i18n_cache.json" ]; then
            cp .i18n_cache.json /tmp/backup/.i18n_cache.json
          fi

          if ! git merge "upstream/${{ env.UPSTREAM_BRANCH }}" -X theirs --allow-unrelated-histories --no-edit; then
            git status --porcelain | awk '$1=="DU" || $1=="UD" {print $2}' | xargs -r git rm -f
            git checkout --theirs . || true
            git add -A
            git commit -m "chore(sync): resolve conflicts taking upstream changes" || true
          fi

          # Restore custom workflows and glossary files from the backup.
          mkdir -p .github/workflows
          cp -r /tmp/backup/workflows/* .github/workflows/ 2>/dev/null || true
          if [ -f "/tmp/backup/security_glossary.json" ]; then
            cp /tmp/backup/security_glossary.json .github/security_glossary.json
          fi
          if [ -f "/tmp/backup/.i18n_cache.json" ]; then
            cp /tmp/backup/.i18n_cache.json .i18n_cache.json
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add .github/ .i18n_cache.json 2>/dev/null || true
            git commit -m "chore(sync): merge upstream yaklang/yakit" || true
          fi

      - name: 4. Enforce English Default Language in i18n.ts
        run: |
          # Main UI နှင့် Startup ဝင်းဒိုးရှိ i18n config အားလုံးကို English (en) သို့ ပြောင်းခြင်း
          for I18N_FILE in \
            "app/renderer/src/main/src/i18n/i18n.ts" \
            "app/renderer/engine-link-startup/src/i18n/i18n.ts" \
            "app/renderer/engine-link-startup/src/i18n.ts"; do
            if [ -f "$I18N_FILE" ]; then
              sed -i "s/lng:.*'zh'/lng: localStorage.getItem('i18nextLng') || 'en'/g" "$I18N_FILE"
              sed -i "s/fallbackLng:.*'zh'/fallbackLng: 'en'/g" "$I18N_FILE"
            fi
          done

          # Startup HTML ဖိုင်များရှိ "正在加载中" ကို "Loading..." သို့ ပြောင်းခြင်း
          for HTML_FILE in \
            "app/renderer/src/main/index.html" \
            "app/renderer/engine-link-startup/index.html"; do
            if [ -f "$HTML_FILE" ]; then
              sed -i "s/正在加载中/Loading.../g" "$HTML_FILE"
            fi
          done

      - name: 5. Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 6. Install tsc, PyYAML & Translation Dependencies
        run: |
          npm install -g typescript@5
          python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: 7. Translate UI, Source Files, PoC YAMLs & .yak Plugins
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import time
          import yaml
          from deep_translator import GoogleTranslator

          # Main UI နှင့် Engine Startup ဝင်းဒိုး (၂) ခုလုံး၏ Locale လမ်းကြောင်းများ
          LOCALE_PAIRS = [
              ("app/renderer/src/main/public/locales/zh", "app/renderer/src/main/public/locales/en"),
              ("app/renderer/engine-link-startup/public/locales/zh", "app/renderer/engine-link-startup/public/locales/en"),
              ("app/renderer/engine-link-startup/src/locales/zh", "app/renderer/engine-link-startup/src/locales/en"),
          ]
          CACHE_FILE = ".i18n_cache.json"
          GLOSSARY_FILE = ".github/security_glossary.json"

          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          placeholder_re = re.compile(r'(\{\{.*?\}\}|\{[0-9a-zA-Z_]+\})')

          def has_zh(text):
              return bool(zh_char_re.search(str(text)))

          exact_glossary = {}
          inline_glossary = {}
          if os.path.exists(GLOSSARY_FILE):
              with open(GLOSSARY_FILE, 'r', encoding='utf-8') as f:
                  g_data = json.load(f)
              for _, mapping in g_data.get("terms", {}).items():
                  if isinstance(mapping, dict):
                      exact_glossary.update(mapping)
                      inline_glossary.update(mapping)
              exact_glossary.update(g_data.get("exact_only", {}))

          sorted_inline = sorted(inline_glossary.keys(), key=len, reverse=True)

          cache = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, 'r', encoding='utf-8') as f:
                      cache = json.load(f)
              except Exception:
                  cache = {}

          # {{variable}} ကွင်းစကွင်းပိတ်များ မပျက်စီးအောင် ကာကွယ်၍ ဘာသာပြန်သည့် စနစ်
          def safe_translate_one(orig):
              stripped = orig.strip()
              if stripped in exact_glossary:
                  return exact_glossary[stripped]

              tokens = []
              def mask_fn(m):
                  tokens.append(m.group(0))
                  return f"__PH{len(tokens)-1}__"

              masked = placeholder_re.sub(mask_fn, orig)
              for zh_k in sorted_inline:
                  if zh_k in masked:
                      masked = masked.replace(zh_k, f" {inline_glossary[zh_k]} ")

              if has_zh(masked):
                  for _ in range(3):
                      try:
                          masked = translator.translate(masked) or masked
                          break
                      except Exception:
                          time.sleep(1.2)

              for idx, tok in enumerate(tokens):
                  masked = re.sub(rf'__PH{idx}__', tok, masked, flags=re.IGNORECASE)
              return re.sub(r' {2,}', ' ', masked).strip()

          def batch_translate(texts):
              new_items = [t for t in texts if t not in cache and has_zh(t)]
              for idx, item in enumerate(new_items):
                  cache[item] = safe_translate_one(item)
                  if idx % 25 == 0 and idx > 0:
                      time.sleep(0.4)

          def collect_json(zh_obj, en_obj, bucket):
              for k, v in zh_obj.items():
                  if isinstance(v, dict):
                      collect_json(v, en_obj.get(k, {}) if isinstance(en_obj.get(k), dict) else {}, bucket)
                  elif isinstance(v, str) and has_zh(v):
                      if k not in en_obj or has_zh(en_obj.get(k, "")):
                          bucket.add(v)

          def apply_json(zh_obj, en_obj):
              changed = False
              for k, v in zh_obj.items():
                  if isinstance(v, dict):
                      if k not in en_obj or not isinstance(en_obj[k], dict):
                          en_obj[k] = {}
                          changed = True
                      if apply_json(v, en_obj[k]):
                          changed = True
                  elif isinstance(v, str) and has_zh(v):
                      if k not in en_obj or has_zh(en_obj.get(k, "")):
                          en_obj[k] = cache.get(v, v)
                          changed = True
              return changed

          for zh_dir, en_dir in LOCALE_PAIRS:
              if not os.path.exists(zh_dir):
                  continue
              os.makedirs(en_dir, exist_ok=True)
              bucket = set()
              pairs = []
              for fname in sorted(os.listdir(zh_dir)):
                  if not fname.endswith(".json"):
                      continue
                  zh_p = os.path.join(zh_dir, fname)
                  en_p = os.path.join(en_dir, fname)
                  with open(zh_p, 'r', encoding='utf-8') as f:
                      zh_d = json.load(f)
                  en_d = {}
                  if os.path.exists(en_p):
                      try:
                          with open(en_p, 'r', encoding='utf-8') as f:
                              en_d = json.load(f)
                      except Exception:
                          en_d = {}
                  collect_json(zh_d, en_d, bucket)
                  pairs.append((en_p, zh_d, en_d))

              batch_translate(list(bucket))
              for en_p, zh_d, en_d in pairs:
                  if apply_json(zh_d, en_d):
                      with open(en_p, 'w', encoding='utf-8') as f:
                          json.dump(en_d, f, ensure_ascii=False, indent=2)

          with open(CACHE_FILE, 'w', encoding='utf-8') as f:
              json.dump(cache, f, ensure_ascii=False, indent=2)
          EOF

      - name: 8. Safety Check (tsc Syntax & JSON Validation + Auto-Revert)
        env:
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
        run: |
          export NODE_PATH="$(npm root -g)"
          node --input-type=commonjs - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const tsModule = require('typescript');
          const ts = tsModule.default || tsModule;

          const upstreamRef = `upstream/${process.env.UPSTREAM_BRANCH || 'master'}`;
          const revertedRecords = [];

          function git(args) {
            return execFileSync('git', args, { encoding: 'utf8' }).trim();
          }

          function revertFile(relPath, tierRef) {
            try {
              git(['cat-file', '-e', `${tierRef}:${relPath}`]);
              git(['checkout', tierRef, '--', relPath]);
              return `Reverted to ${tierRef}`;
            } catch {
              try {
                git(['cat-file', '-e', `${upstreamRef}:${relPath}`]);
                git(['checkout', upstreamRef, '--', relPath]);
                return `Reverted to ${upstreamRef}`;
              } catch {
                if (fs.existsSync(relPath)) fs.unlinkSync(relPath);
                return 'Removed corrupt untracked file';
              }
            }
          }

          const rawFiles = git(['ls-files', '--modified', '--others', '--exclude-standard']);
          const changedFiles = rawFiles
            ? rawFiles.split('\n').map(s => s.trim()).filter(f => f && fs.existsSync(f))
            : [];

          const jsonFiles = changedFiles.filter(f => f.endsWith('.json'));
          const tsFiles = changedFiles.filter(f => (f.endsWith('.ts') || f.endsWith('.tsx')) && !f.endsWith('.d.ts'));

          for (const jf of jsonFiles) {
            try {
              JSON.parse(fs.readFileSync(jf, 'utf8'));
            } catch (err) {
              const action = revertFile(jf, 'HEAD');
              revertedRecords.push({ file: jf, code: 'JSON_ERR', reason: err.message, action });
            }
          }

          function checkTsSyntax(filesToCheck) {
            if (filesToCheck.length === 0) return new Map();
            const compilerOptions = {
              target: ts.ScriptTarget.ESNext,
              module: ts.ModuleKind.ESNext,
              jsx: ts.JsxEmit.Preserve,
              experimentalDecorators: true,
              allowJs: true,
              noEmit: true,
              noResolve: true,
              skipLibCheck: true,
              types: []
            };

            const absMap = new Map();
            const absList = [];
            for (const rel of filesToCheck) {
              if (fs.existsSync(rel)) {
                const abs = path.resolve(rel);
                absMap.set(abs, rel);
                absList.push(abs);
              }
            }

            const program = ts.createProgram(absList, compilerOptions);
            const brokenMap = new Map();

            for (const [abs, rel] of absMap.entries()) {
              const sourceFile = program.getSourceFile(abs);
              if (!sourceFile) continue;
              const diagnostics = program.getSyntacticDiagnostics(sourceFile);
              if (diagnostics.length > 0) {
                const d = diagnostics[0];
                const { line, character } = sourceFile.getLineAndCharacterOfPosition(d.start || 0);
                const msg = ts.flattenDiagnosticMessageText(d.messageText, ' ');
                brokenMap.set(rel, { code: `TS${d.code}`, reason: `Line ${line + 1}:${character + 1} - ${msg}` });
              }
            }
            return brokenMap;
          }

          const pass1Broken = checkTsSyntax(tsFiles);
          for (const [rel, info] of pass1Broken.entries()) {
            const action = revertFile(rel, 'HEAD');
            revertedRecords.push({ file: rel, code: info.code, reason: info.reason, action });
          }

          const pass2Broken = checkTsSyntax(tsFiles);
          for (const [rel, info] of pass2Broken.entries()) {
            const action = revertFile(rel, upstreamRef);
            revertedRecords.push({ file: rel, code: info.code, reason: info.reason, action });
          }

          if (process.env.GITHUB_STEP_SUMMARY) {
            let md = `### Full-Stack Translation Safety Check Report\n\n`;
            md += `- **Scanned TypeScript/Plugin Files:** ${tsFiles.length}\n`;
            md += `- **Scanned JSON Locales:** ${jsonFiles.length}\n`;
            md += `- **Auto-Reverted Files:** ${revertedRecords.length}\n\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          EOF

      - name: 9. Commit and Push Verified English Edition
        run: |
          git add -f .i18n_cache.json .github/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(i18n): sync upstream and translate UI, plugins & PoC metadata to English"
          fi
          git push -u origin "${{ env.TARGET_BRANCH }}"

      - name: 10. Detect New Upstream Release & Prepare Tag
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check the latest official release tag from yaklang/yakit.
          UPSTREAM_LATEST=$(gh api repos/yaklang/yakit/releases/latest --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$UPSTREAM_LATEST" ] || [ "$UPSTREAM_LATEST" == "null" ]; then
            UPSTREAM_LATEST=$(git tag -l "v*" --sort=-creatordate | grep -v -- "-en" | head -n 1)
          fi

          if [ -z "$UPSTREAM_LATEST" ]; then
            UPSTREAM_LATEST="v$(date +'%Y.%m.%d')"
          fi

          EN_TAG="${UPSTREAM_LATEST}-en"
          echo "Latest Upstream Release: ${UPSTREAM_LATEST} -> Target English Tag: ${EN_TAG}"

          # Check whether this English tag has already been released in the fork.
          RELEASE_EXISTS="false"
          if gh release view "${EN_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi

          if [ "${RELEASE_EXISTS}" == "false" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            echo "New upstream release detected (or forced)! Creating tag ${EN_TAG}..."
            git tag -f "${EN_TAG}"
            git push origin "${EN_TAG}" --force
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${EN_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "English release ${EN_TAG} already exists. Skipping build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=${EN_TAG}" >> "$GITHUB_OUTPUT"
          fi

  # Trigger release-en.yml to build when a new upstream release is detected.
  trigger-english-build:
    name: Auto-Trigger Multi-OS English Release
    needs: sync-and-translate
    if: needs.sync-and-translate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch English release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sync-and-translate.outputs.release_tag }}
        run: >-
          gh workflow run release-en.yml
          --repo "${{ github.repository }}"
          --ref "$RELEASE_TAG"
          --field tag_name="$RELEASE_TAG"
          --field target_ref="$RELEASE_TAG"
