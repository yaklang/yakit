syntax = "proto3";

package ypb;
option go_package = "/;ypb";

// This protocol is intentionally independent from the monolithic HTTPFlow
// message. A live summary can never carry packet bodies by construction.
enum HTTPFlowLiveEventType {
  HTTP_FLOW_LIVE_EVENT_TYPE_UNSPECIFIED = 0;
  HTTP_FLOW_LIVE_EVENT_TYPE_COMMITTED = 1;
  HTTP_FLOW_LIVE_EVENT_TYPE_UPDATED = 2;
  HTTP_FLOW_LIVE_EVENT_TYPE_DELETED = 3;
  HTTP_FLOW_LIVE_EVENT_TYPE_GAP = 4;
  HTTP_FLOW_LIVE_EVENT_TYPE_HEARTBEAT = 5;
}

enum HTTPFlowLiveGapReason {
  HTTP_FLOW_LIVE_GAP_REASON_UNSPECIFIED = 0;
  HTTP_FLOW_LIVE_GAP_REASON_BOOTSTRAP_REQUIRED = 1;
  HTTP_FLOW_LIVE_GAP_REASON_PROJECT_CHANGED = 2;
  HTTP_FLOW_LIVE_GAP_REASON_REPLAY_WINDOW_EXCEEDED = 3;
  HTTP_FLOW_LIVE_GAP_REASON_SLOW_CONSUMER = 4;
  HTTP_FLOW_LIVE_GAP_REASON_CURSOR_AHEAD = 5;
  HTTP_FLOW_LIVE_GAP_REASON_UNSUPPORTED_PROTOCOL = 6;
  HTTP_FLOW_LIVE_GAP_REASON_UNSUPPORTED_FILTER = 7;
  HTTP_FLOW_LIVE_GAP_REASON_PROJECT_EVICTED = 8;
}

message HTTPFlowLiveFilter {
  // v1 accepts an empty value or "mitm". QueryHTTPFlows remains the fallback
  // for all richer filters.
  string SourceType = 1;
}

message SubscribeHTTPFlowsRequest {
  uint32 ProtocolVersion = 1;
  uint64 LastSeenSequence = 2;
  uint64 LastSeenId = 3;
  uint64 ProjectGeneration = 4;
  string DatabaseIdentity = 5;
  string SessionId = 6;
  HTTPFlowLiveFilter Filter = 7;
}

message HTTPFlowLiveSummary {
  uint64 Id = 1;
  bool IsHTTPS = 2;
  string Url = 3;
  string SourceType = 4;
  string Path = 5;
  string Method = 6;
  int64 BodyLength = 7;
  string BodySizeVerbose = 8;
  int64 RequestLength = 9;
  string RequestSizeVerbose = 10;
  string ContentType = 11;
  int64 StatusCode = 12;
  int64 GetParamsTotal = 13;
  int64 PostParamsTotal = 14;
  int64 CookieParamsTotal = 15;
  int64 UpdatedAt = 16;
  int64 CreatedAt = 17;
  string Hash = 18;
  string HostPort = 19;
  string IPAddress = 20;
  string HtmlTitle = 21;
  string Tags = 22;
  bool NoFixContentLength = 23;
  bool IsWebsocket = 24;
  string WebsocketHash = 25;
  bool IsReadTooSlowResponse = 26;
  bool IsTooLargeResponse = 27;
  string TooLargeResponseHeaderFile = 28;
  string TooLargeResponseBodyFile = 29;
  int64 DurationMs = 30;
  string HiddenIndex = 31;
  string FromPlugin = 32;
  string Host = 33;
  string PathSuffix = 34;
  bool IsTooLargeRequest = 35;
  string TooLargeRequestHeaderFile = 36;
  string TooLargeRequestBodyFile = 37;
  bool IsRequestOversize = 38;
}

message HTTPFlowLiveGap {
  HTTPFlowLiveGapReason Reason = 1;
  uint64 RequestedSequence = 2;
  uint64 OldestAvailableSequence = 3;
  uint64 LatestSequence = 4;
  uint64 HighWaterId = 5;
}

message HTTPFlowLiveEvent {
  uint32 ProtocolVersion = 1;
  HTTPFlowLiveEventType Type = 2;
  uint64 Sequence = 3;
  uint64 ProjectGeneration = 4;
  string DatabaseIdentity = 5;
  int64 ServerAtUnixMs = 6;
  int64 CommittedAtUnixMs = 7;
  uint64 HighWaterId = 8;
  HTTPFlowLiveSummary Flow = 9;
  HTTPFlowLiveGap Gap = 10;
  string SessionId = 11;
  bool Replayed = 12;
  // Optional process-local timings let the renderer preserve end-to-end
  // observability when a body-free summary is rendered without a follow-up
  // QueryHTTPFlows round trip.
  int64 RequestHijackAtUnixMs = 13;
  int64 ResponseMirrorAtUnixMs = 14;
  int64 FlowBuiltAtUnixMs = 15;
  int64 PersistEnqueuedAtUnixMs = 16;
  int64 PersistStartedAtUnixMs = 17;
}
